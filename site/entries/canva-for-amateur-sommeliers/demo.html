<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legs editor · theworstaistudioever</title>
<meta name="description" content="The Legs tasting-note editor. Descriptors in, confidence out.">
<meta name="theme-color" content="#1A1113">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --claret: #7B1E2B;
    --claret-deep: #5E1520;
    --gold: #C9A45C;
    --gold-dim: #8C7443;
    --bg: #1A1113;
    --panel: #221618;
    --panel-2: #2B1D20;
    --line: rgba(201,164,92,.18);
    --fg: #F1E6D6;
    --muted: #B3A196;
    --ink: #F6ECDD;
    --display: 'Gloock', 'Didot', Georgia, serif;
    --body: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'Fragment Mono', ui-monospace, Menlo, monospace;
    --wine: #7B1E2B;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: 56px 1fr; min-height: 100vh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* top bar */
  .bar {
    display: flex; align-items: center; gap: 18px; padding: 0 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .back { color: var(--muted); text-decoration: none; font-size: 14px; white-space: nowrap; }
  .back:hover { color: var(--ink); }
  .bar .mark { font-family: var(--display); font-size: 22px; color: var(--ink); }
  .docname {
    background: transparent; border: 1px solid transparent; color: var(--fg);
    font: 500 15px var(--body); padding: 6px 8px; min-width: 0; width: 260px;
  }
  .docname:hover, .docname:focus { border-color: var(--line); outline: none; }
  .saved { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .bar .spacer { flex: 1; }
  .btn {
    min-height: 38px; padding: 0 16px; border: 1px solid var(--line); background: transparent;
    font-weight: 500; font-size: 14px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--gold-dim); }
  .btn-pour { background: var(--claret); border-color: var(--claret); color: var(--ink); position: relative; }
  .btn-pour::after { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(201,164,92,.45); pointer-events: none; }
  .btn-pour:hover { background: var(--claret-deep); }

  /* layout */
  .editor { display: grid; grid-template-columns: 300px 1fr 272px; min-height: 0; }
  .rail, .inspector { background: var(--panel); min-height: 0; overflow: auto; }
  .rail { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .inspector { border-left: 1px solid var(--line); padding: 20px; }

  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab {
    flex: 1; background: none; border: 0; padding: 14px 0 12px; color: var(--muted);
    border-bottom: 2px solid transparent; font-weight: 500;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
  .pane { padding: 16px; display: none; }
  .pane.on { display: block; }

  .search {
    width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--fg);
    padding: 10px 12px; font: 15px var(--body);
  }
  .search::placeholder { color: #857368; }
  .search:focus { border-color: var(--gold-dim); outline: none; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 16px; }
  .cat {
    background: none; border: 1px solid var(--line); padding: 5px 11px; font-size: 13px; color: var(--muted); border-radius: 999px;
  }
  .cat[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .lib { display: flex; flex-direction: column; gap: 6px; }
  .chip {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px; text-align: left;
    background: var(--panel-2); border: 1px solid transparent; padding: 10px 12px; font-size: 14.5px;
  }
  .chip:hover { border-color: var(--gold-dim); }
  .chip.used { opacity: .45; }
  .chip small { font-family: var(--mono); font-size: 11.5px; color: var(--gold); white-space: nowrap; }
  .empty { color: var(--muted); font-size: 14px; padding: 18px 4px; }

  .tpl { width: 100%; text-align: left; background: var(--panel-2); border: 1px solid transparent; padding: 14px; margin-bottom: 8px; }
  .tpl strong { display: block; font-family: var(--display); font-weight: 400; font-size: 19px; color: var(--ink); }
  .tpl span { font-size: 13px; color: var(--muted); }
  .tpl[aria-pressed="true"] { border-color: var(--gold); }

  .swatches { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .sw {
    display: flex; align-items: center; gap: 12px; background: var(--panel-2); border: 1px solid transparent; padding: 8px 10px; text-align: left; font-size: 14px;
  }
  .sw i { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255,255,255,.15); flex: none; }
  .sw[aria-pressed="true"] { border-color: var(--gold); }

  /* stage */
  .stage {
    min-height: 0; overflow: auto; display: grid; place-items: center; padding: 40px 24px;
    background:
      radial-gradient(circle at 50% 45%, rgba(123,30,43,.16), transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 23px, rgba(201,164,92,.04) 23px 24px),
      repeating-linear-gradient(90deg, transparent 0 23px, rgba(201,164,92,.04) 23px 24px),
      #150E10;
  }
  .card-wrap { position: relative; }
  .card-wrap .dims { position: absolute; top: -26px; left: 0; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .card {
    width: min(520px, 82vw); min-height: 600px; position: relative;
    padding: 42px 44px 36px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 18px;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
    transition: background .3s, color .3s;
  }
  .card.cellar { background: #F4EADB; color: #2A1A1C; }
  .card.cellar::after { content: ""; position: absolute; inset: 12px; border: 1px solid #C9A45C; pointer-events: none; }
  .card.menu { background: #FBF7F0; color: #1D1416; text-align: center; }
  .card.chalk { background: #232826; color: #EDEAE2; font-family: 'Hanken Grotesk', sans-serif; }
  .card.chalk::after { content: ""; position: absolute; inset: 0; border: 12px solid #5A3E2B; pointer-events: none; }

  .c-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .menu .c-top { flex-direction: column; align-items: center; gap: 2px; }
  .c-name {
    font-family: var(--display); font-size: 36px; line-height: 1.02; margin: 0; letter-spacing: -0.01em;
    outline: none;
  }
  .c-vintage { font-family: var(--mono); font-size: 14px; opacity: .7; white-space: nowrap; }
  .c-region { font-style: italic; font-size: 15px; opacity: .72; margin: -8px 0 0; }
  .chalk .c-name { font-family: 'Hanken Grotesk', sans-serif; font-weight: 600; font-style: italic; }

  .c-body { display: grid; grid-template-columns: 110px 1fr; gap: 26px; align-items: start; }
  .menu .c-body { grid-template-columns: 1fr; justify-items: center; }
  .glass { width: 110px; height: 200px; transform-origin: 50% 90%; }
  .glass .wine { fill: var(--wine); transition: fill .35s; }
  .glass .bowl { fill: rgba(255,255,255,.18); stroke: currentColor; stroke-opacity: .5; stroke-width: 1.4; }
  .glass .stem { stroke: currentColor; stroke-opacity: .5; stroke-width: 1.4; fill: none; }
  .glass.swirl { animation: swirl .7s cubic-bezier(.3,.7,.3,1); }
  @keyframes swirl { 0% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 55% { transform: rotate(7deg); } 80% { transform: rotate(-3deg); } 100% { transform: rotate(0); } }

  .notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .menu .notes { align-items: center; }
  .notes li button {
    background: none; border: 1px dashed transparent; padding: 3px 6px; margin-left: -6px; text-align: left;
    font-family: var(--display); font-size: 21px; line-height: 1.25; color: inherit;
  }
  .chalk .notes li button { font-family: 'Hanken Grotesk', sans-serif; font-size: 19px; }
  .notes li button:hover { border-color: currentColor; text-decoration: line-through; text-decoration-thickness: 1px; }
  .notes .hint { font-size: 14px; opacity: .6; font-style: italic; }

  .c-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; font-size: 13px; border-top: 1px solid currentColor; padding-top: 14px; opacity: .8; }
  .menu .c-foot { justify-content: center; flex-direction: column; align-items: center; }
  .c-foot .score { font-family: var(--mono); font-size: 13px; }
  .watermark { font-style: italic; }

  /* inspector */
  .inspector h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0 0 4px; color: var(--ink); }
  .inspector .lede { color: var(--muted); font-size: 13.5px; margin: 0 0 20px; }
  .meter { margin-bottom: 22px; }
  .meter-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 14px; }
  .meter-head b { font-family: var(--mono); font-weight: 400; color: var(--gold); font-variant-numeric: tabular-nums; }
  .track { height: 8px; background: var(--bg); border: 1px solid var(--line); }
  .fill { height: 100%; width: 0; background: var(--claret); transition: width .35s cubic-bezier(.3,.7,.3,1); }
  .fill.gold { background: var(--gold); }
  .verdict { font-size: 13.5px; color: var(--fg); background: var(--panel-2); padding: 12px 14px; margin: 0 0 20px; border-left: 2px solid var(--gold); min-height: 64px; }
  .stack { display: grid; gap: 8px; }
  .stack .btn { width: 100%; }
  .count { font-size: 13px; color: var(--muted); margin-top: 18px; }
  .count b { font-family: var(--mono); font-weight: 400; color: var(--fg); }

  /* toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--ink); color: var(--bg); padding: 10px 18px; font-size: 14px; font-weight: 500;
    transition: opacity .2s, transform .2s; pointer-events: none; z-index: 30; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* present modal */
  .present {
    position: fixed; inset: 0; background: rgba(10,6,7,.92); display: none; place-items: center; z-index: 40; padding: 24px;
  }
  .present.open { display: grid; }
  .present .card { transform: scale(1.04); }
  .present .close { position: absolute; top: 18px; right: 18px; background: none; border: 1px solid var(--line); color: var(--fg); padding: 8px 14px; }
  .present .caption { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: 14px; font-style: italic; }

  @media (max-width: 1080px) {
    .editor { grid-template-columns: 260px 1fr; }
    .inspector { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 28px; }
  }
  @media (max-width: 720px) {
    body { grid-template-rows: auto 1fr; }
    .bar { flex-wrap: wrap; padding: 10px 12px; gap: 10px; }
    .docname, .saved, .bar .mark { display: none; }
    .editor { grid-template-columns: 1fr; }
    .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: 340px; }
    .stage { padding: 36px 12px; }
    .card { padding: 32px 26px 28px; min-height: 520px; }
    .c-body { grid-template-columns: 80px 1fr; gap: 16px; }
    .glass { width: 80px; height: 150px; }
    .c-name { font-size: 28px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .glass.swirl { animation: none; }
    .fill, .toast, .card { transition: none; }
  }
</style>
</head>
<body>

<header class="bar">
  <a class="back" href="./index.html">← back to the pitch</a>
  <span class="mark" aria-hidden="true">Legs</span>
  <input class="docname" id="docname" value="Friday, the one Gary brought" aria-label="Document name">
  <span class="saved" id="saved">Saved to cellar</span>
  <span class="spacer"></span>
  <button class="btn" id="swirlTop" type="button">Swirl</button>
  <button class="btn btn-pour" id="presentBtn" type="button">Present to table</button>
</header>

<div class="editor">
  <aside class="rail" aria-label="Assets">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" aria-controls="p-desc" id="t-desc" type="button">Descriptors</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="p-tpl" id="t-tpl" type="button">Templates</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="p-glass" id="t-glass" type="button">Glass</button>
    </div>

    <div class="pane on" id="p-desc" role="tabpanel" aria-labelledby="t-desc">
      <label for="q" class="visually-hidden" style="position:absolute;left:-9999px">Search descriptors</label>
      <input class="search" id="q" type="search" placeholder="Search 4,200 descriptors" autocomplete="off">
      <div class="cats" id="cats" aria-label="Filter by category"></div>
      <div class="lib" id="lib"></div>
    </div>

    <div class="pane" id="p-tpl" role="tabpanel" aria-labelledby="t-tpl">
      <button class="tpl" data-tpl="cellar" aria-pressed="true" type="button"><strong>Cellar Card</strong><span>Gold keyline. Suggests you own a cellar.</span></button>
      <button class="tpl" data-tpl="menu" aria-pressed="false" type="button"><strong>Menu Column</strong><span>Centered. Reads as though someone else wrote it.</span></button>
      <button class="tpl" data-tpl="chalk" aria-pressed="false" type="button"><strong>Chalkboard</strong><span>For natural wine. Mild handwriting implied.</span></button>
    </div>

    <div class="pane" id="p-glass" role="tabpanel" aria-labelledby="t-glass">
      <div class="swatches" id="swatches"></div>
    </div>
  </aside>

  <main class="stage" aria-label="Canvas">
    <div class="card-wrap">
      <span class="dims">Tasting note · 5 × 7 in</span>
      <article class="card cellar" id="card"></article>
    </div>
  </main>

  <aside class="inspector" aria-label="Inspector">
    <div>
      <h2>Inspector</h2>
      <p class="lede">Live readings. Legs updates these whether or not you asked.</p>
      <div class="meter">
        <div class="meter-head"><span>Pretension</span><b id="pVal">0</b></div>
        <div class="track"><div class="fill" id="pFill"></div></div>
      </div>
      <div class="meter">
        <div class="meter-head"><span>Believability</span><b id="bVal">100</b></div>
        <div class="track"><div class="fill gold" id="bFill"></div></div>
      </div>
    </div>
    <div>
      <p class="verdict" id="verdict" aria-live="polite"></p>
      <div class="stack">
        <button class="btn" id="brandKit" type="button">Apply Palate Brand Kit</button>
        <button class="btn" id="clearBtn" type="button">Clear the note</button>
      </div>
      <p class="count">Descriptors on card: <b id="count">0</b> of <b id="limit">7</b></p>
    </div>
  </aside>
</div>

<div class="present" id="present" role="dialog" aria-modal="true" aria-label="Present to table">
  <button class="close" id="closePresent" type="button">Close</button>
  <div id="presentSlot"></div>
  <p class="caption">Hold eye contact. Swirl once. Do not take questions.</p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var LIB = [
    ["blackcurrant", "Fruit", 12], ["stewed plum", "Fruit", 14], ["a sour cherry you regret", "Fruit", 26], ["crushed raspberry", "Fruit", 10], ["quince, allegedly", "Fruit", 31], ["one (1) strawberry", "Fruit", 18],
    ["wet slate", "Earth", 34], ["forest floor after a light argument", "Earth", 44], ["crushed gravel", "Earth", 30], ["a hint of barnyard", "Earth", 38], ["graphite", "Earth", 36], ["the inside of a cathedral", "Earth", 52],
    ["restraint", "Emotional", 40], ["quiet tension", "Emotional", 46], ["a long, apologetic finish", "Emotional", 48], ["unresolved grief, but bright", "Emotional", 58], ["confidence it has not earned", "Emotional", 41],
    ["terroir", "Expensive", 55], ["minerality", "Expensive", 50], ["pencil shavings", "Expensive", 42], ["cigar box", "Expensive", 45], ["Burgundian, in spirit", "Expensive", 62], ["old oak you can hear", "Expensive", 57]
  ];
  var CATS = ["All", "Fruit", "Earth", "Emotional", "Expensive"];
  var HUES = [
    ["rosé-adjacent", "#D98A8F"], ["garnet, probably", "#8E2233"], ["claret", "#7B1E2B"], ["brick at the rim", "#8A3A26"],
    ["purple, like a bruise", "#4E1A3A"], ["inky, frankly", "#2A0E18"], ["white (you brought white)", "#E4D38A"]
  ];
  var LIMIT = 7;
  var state = { notes: ["blackcurrant", "wet slate", "restraint"], cat: "All", q: "", tpl: "cellar", hue: 2 };

  var $ = function (id) { return document.getElementById(id); };
  var weightOf = function (name) { for (var i = 0; i < LIB.length; i++) if (LIB[i][0] === name) return LIB[i][2]; return 0; };

  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }
  function saved() {
    var s = $("saved"); s.textContent = "Saving…";
    clearTimeout(saved.h); saved.h = setTimeout(function () { s.textContent = "Saved to cellar"; }, 500);
  }

  function renderCats() {
    var el = $("cats"); el.innerHTML = "";
    CATS.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "cat"; b.textContent = c;
      b.setAttribute("aria-pressed", String(state.cat === c));
      b.onclick = function () { state.cat = c; renderCats(); renderLib(); };
      el.appendChild(b);
    });
  }

  function renderLib() {
    var el = $("lib"); el.innerHTML = "";
    var q = state.q.trim().toLowerCase();
    var items = LIB.filter(function (d) {
      return (state.cat === "All" || d[1] === state.cat) && (!q || d[0].toLowerCase().indexOf(q) !== -1);
    });
    if (!items.length) {
      var e = document.createElement("p"); e.className = "empty";
      e.textContent = "Nothing matches. Try 'slate'. Everything is slate eventually.";
      el.appendChild(e); return;
    }
    items.forEach(function (d) {
      var used = state.notes.indexOf(d[0]) !== -1;
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip" + (used ? " used" : "");
      b.setAttribute("aria-pressed", String(used));
      var s = document.createElement("span"); s.textContent = d[0];
      var sm = document.createElement("small"); sm.textContent = "+" + d[2] + " pret.";
      b.appendChild(s); b.appendChild(sm);
      b.onclick = function () { toggle(d[0]); };
      el.appendChild(b);
    });
  }

  function toggle(name) {
    var i = state.notes.indexOf(name);
    if (i !== -1) { state.notes.splice(i, 1); }
    else {
      if (state.notes.length >= LIMIT) { toast("Seven descriptors is the legal limit at a dinner party. Remove one."); return; }
      state.notes.push(name);
    }
    saved(); render();
  }

  function glassSVG() {
    return '<svg class="glass" id="glass" viewBox="0 0 110 200" aria-hidden="true">' +
      '<path class="wine" d="M22 62 Q20 104 55 112 Q90 104 88 62 Z"/>' +
      '<path class="bowl" d="M18 10 L92 10 Q96 70 86 92 Q74 116 55 118 Q36 116 24 92 Q14 70 18 10 Z"/>' +
      '<path class="stem" d="M55 118 L55 182 M30 188 Q55 180 80 188"/>' +
      '</svg>';
  }

  function scores() {
    var p = 0; state.notes.forEach(function (n) { p += weightOf(n); });
    p = Math.min(100, Math.round(p / 2.6));
    var b = Math.max(3, 100 - Math.round(p * 0.9) - state.notes.length * 4);
    if (state.hue === 6) b = Math.max(3, b - 20);
    return { p: p, b: b };
  }

  function verdictFor(s) {
    if (!state.notes.length) return "The card is empty. You could say 'nice'. We would not.";
    if (s.p < 20) return "Reads like a person who likes wine. Guests will relax. Consider adding slate.";
    if (s.p < 45) return "Solid amateur register. Someone will ask where you studied. Say 'here and there'.";
    if (s.p < 70) return "Host-grade. At least one guest will pretend to taste the cathedral.";
    return "Maximum pour. Believability is gone, but so is the conversation, which was the goal.";
  }

  function cardHTML() {
    var hue = HUES[state.hue];
    var s = scores();
    var list = state.notes.length
      ? state.notes.map(function (n) { return '<li><button type="button" data-note="' + n.replace(/"/g, "&quot;") + '" title="Remove from note">' + n + '</button></li>'; }).join("")
      : '<li class="hint">Pick descriptors from the left. The wine will not be consulted.</li>';
    var mark = state.notes.length <= 3 ? '<span class="watermark">I liked it</span>' : '<span class="watermark">Composed with Legs</span>';
    return '<div class="c-top"><h1 class="c-name" contenteditable="true" spellcheck="false">Château Probablement</h1><span class="c-vintage">2021</span></div>' +
      '<p class="c-region">Colour noted as ' + hue[0] + '</p>' +
      '<div class="c-body">' + glassSVG() + '<ul class="notes">' + list + '</ul></div>' +
      '<div class="c-foot">' + mark + '<span class="score">Pretension ' + s.p + ' / Believability ' + s.b + '</span></div>';
  }

  var cardName = "Château Probablement";
  function renderCard(target) {
    target.className = "card " + state.tpl;
    target.innerHTML = cardHTML();
    var n = target.querySelector(".c-name"); n.textContent = cardName;
    n.addEventListener("input", function () { cardName = n.textContent; saved(); });
    target.querySelectorAll("[data-note]").forEach(function (b) {
      b.onclick = function () { toggle(b.getAttribute("data-note")); };
    });
  }

  function render() {
    document.documentElement.style.setProperty("--wine", HUES[state.hue][1]);
    renderCard($("card"));
    renderLib();
    var s = scores();
    $("pVal").textContent = s.p; $("pFill").style.width = s.p + "%";
    $("bVal").textContent = s.b; $("bFill").style.width = s.b + "%";
    $("verdict").textContent = verdictFor(s);
    $("count").textContent = state.notes.length;
  }

  function renderSwatches() {
    var el = $("swatches"); el.innerHTML = "";
    HUES.forEach(function (h, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "sw"; b.setAttribute("aria-pressed", String(state.hue === i));
      var dot = document.createElement("i"); dot.style.background = h[1];
      var t = document.createElement("span"); t.textContent = h[0];
      b.appendChild(dot); b.appendChild(t);
      b.onclick = function () {
        state.hue = i; renderSwatches(); render(); saved();
        if (i === 6) toast("Noted. Believability adjusted for white.");
      };
      el.appendChild(b);
    });
  }

  // tabs
  var tabs = document.querySelectorAll(".tab");
  tabs.forEach(function (t) {
    t.onclick = function () {
      tabs.forEach(function (x) {
        var on = x === t; x.setAttribute("aria-selected", String(on));
        $(x.getAttribute("aria-controls")).classList.toggle("on", on);
      });
    };
  });

  // templates
  document.querySelectorAll(".tpl").forEach(function (b) {
    b.onclick = function () {
      state.tpl = b.getAttribute("data-tpl");
      document.querySelectorAll(".tpl").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      render(); saved();
    };
  });

  $("q").addEventListener("input", function (e) { state.q = e.target.value; renderLib(); });

  function swirl() {
    var g = document.querySelectorAll(".glass");
    g.forEach(function (el) { el.classList.remove("swirl"); void el.getBoundingClientRect(); el.classList.add("swirl"); });
    toast(state.notes.length ? "Swirled. Legs detected: " + (3 + state.notes.length) + ". Very legitimate." : "Swirled an empty note. Bold.");
  }
  $("swirlTop").onclick = swirl;

  $("brandKit").onclick = function () {
    state.notes = ["graphite", "restraint", "wet slate", "quiet tension", "terroir"];
    render(); saved(); toast("Brand Kit applied. Every wine you drink now tastes like this.");
  };
  $("clearBtn").onclick = function () { state.notes = []; render(); saved(); toast("Note cleared. You may now say 'nice'."); };

  // present
  var present = $("present"), lastFocus = null;
  function openPresent() {
    lastFocus = document.activeElement;
    var slot = $("presentSlot"); slot.innerHTML = "";
    var c = document.createElement("article"); slot.appendChild(c); renderCard(c);
    c.querySelector(".c-name").setAttribute("contenteditable", "false");
    c.querySelectorAll("[data-note]").forEach(function (b) { b.disabled = true; b.style.cursor = "default"; });
    present.classList.add("open"); $("closePresent").focus();
  }
  function closePresent() { present.classList.remove("open"); if (lastFocus) lastFocus.focus(); }
  $("presentBtn").onclick = openPresent;
  $("closePresent").onclick = closePresent;
  present.addEventListener("click", function (e) { if (e.target === present) closePresent(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && present.classList.contains("open")) closePresent(); });

  $("docname").addEventListener("input", saved);

  renderCats(); renderSwatches(); render();
})();
</script>
</body>
</html>
