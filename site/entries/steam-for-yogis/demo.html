<style>
  :root {
    --primary: #5FA8D3;
    --accent: #A9BE55;
    --bg: #151C26;
    --panel: #1C2634;
    --panel-2: #1A2230;
    --well: #10161E;
    --border: #2A3648;
    --border-bright: #3D4E66;
    --fg: #E8EDF2;
    --muted: #77879B;
    --ink: #EAF0F6;
    --neg: #B0653A;
    --display: 'Marcellus', Georgia, 'Times New Roman', serif;
    --body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'Space Mono', 'Courier New', monospace;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 15px;

    min-height: 100vh;
    display: flex;
    flex-direction: column;

  a { color: var(--primary); text-decoration: none; }

  button { font-family: inherit; cursor: pointer; }

  /* ---------- top chrome ---------- */
  .chrome {
    display: flex; align-items: center; gap: 20px;
    padding: 0 18px; height: 52px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);

  .back-link { font-size: 0.82rem; color: var(--muted); }
  .back-link:hover { color: var(--primary); }
  .chrome .wordmark {
    font-family: var(--display);
    font-size: 1.1rem;
    letter-spacing: 0.06em;
    color: var(--primary);
  }
  .chrome-tabs { display: flex; gap: 16px; margin-left: 10px; }
  .chrome-tabs span {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding: 4px 2px;
  }
  .chrome-tabs .active { color: var(--fg); border-bottom: 2px solid var(--primary); }
  .user-plate {
    margin-left: auto;
    display: flex; align-items: center; gap: 12px;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
  }
  .user-plate .wallet { color: var(--accent); }

  /* ---------- layout ---------- */
  .app { display: flex; flex: 1; min-height: 0; }

  .sidebar {
    width: 292px; flex-shrink: 0;
    background: var(--panel-2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .side-controls { padding: 14px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; }
  .side-controls input, .side-controls select {
    width: 100%;
    background: var(--well);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--fg);
    font-family: var(--body);
    font-size: 0.85rem;
    padding: 8px 10px;
  }
  .side-controls input::placeholder { color: var(--muted); }
  .side-list { overflow-y: auto; flex: 1; }
  .pose-row {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: none; border: none; border-bottom: 1px solid var(--border);
    color: var(--fg);
    padding: 11px 14px;
    text-align: left;
    font-size: 0.88rem;
  }
  .pose-row:hover { background: var(--panel); }
  .pose-row.selected { background: var(--panel); border-left: 3px solid var(--primary); padding-left: 11px; }
  .pose-row .hrs { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
  .pose-row .ea-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); margin-right: 6px; vertical-align: 1px;
  }
  .side-foot {
    border-top: 1px solid var(--border);
    padding: 12px 14px;
    font-family: var(--mono);
    font-size: 0.66rem;
    color: var(--muted);
    letter-spacing: 0.06em;
    line-height: 1.8;
  }
  .side-foot .bad { color: var(--neg); }

  /* ---------- detail ---------- */
  .detail { flex: 1; overflow-y: auto; }
  .detail-inner { max-width: 860px; margin: 0 auto; padding: 26px 28px 60px; }

  .art-frame {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 20px;
    background: var(--panel);

  .art-frame img, .art-ph { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
  .art-ph {
    display: grid; place-items: center;
    background: radial-gradient(ellipse at 30% 20%, #22304211, transparent 60%), linear-gradient(160deg, #1E2A3A, #10161E);
  }
  .art-ph span {
    font-family: var(--display);
    font-size: 5rem;
    color: var(--border-bright);
  }
  .art-frame .corner-tag {
    position: absolute; top: 12px; left: -4px;
    background: var(--accent); color: #141A0A;
    font-family: var(--mono); font-weight: 700; font-size: 0.72rem;
    padding: 4px 12px; letter-spacing: 0.06em;
    border-radius: 0 2px 2px 0;
  }

  .title-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  .pose-title { font-family: var(--display); font-weight: 400; font-size: 2rem; color: var(--ink); }
  .build-no { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
  .verdict-row { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; font-size: 0.85rem; }
  .verdict-row .k { color: var(--muted); }
  .v-pos { color: var(--accent); font-weight: 600; }
  .v-mix { color: var(--primary); font-weight: 600; }
  .v-neg { color: var(--neg); font-weight: 600; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }

    font-family: var(--mono); font-size: 0.62rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted);
    background: var(--well);
    border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 2px;
  }

  .action-bar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 22px;

  .btn-play {
    background: var(--primary);

  .hours-plate { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); line-height: 1.7; }
  .install-zone { flex: 1; min-width: 220px; }

    border: 1px solid var(--border);
    border-radius: 4px; overflow: hidden;
    margin-bottom: 6px;
    display: none;

  .install-status { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); min-height: 1.2em; }

  .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 22px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px;

  .panel h2 {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);

  .hist-row .k { color: var(--muted); width: 84px; flex-shrink: 0; }
  .hist-track { flex: 1; height: 6px; background: var(--well); border-radius: 3px; overflow: hidden; }
  .hist-fill { height: 100%; border-radius: 3px; background: var(--primary); }
  .hist-fill.neg { background: var(--neg); }
  .hist-row .n { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); width: 38px; text-align: right; }

  .ach { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .ach:last-child { border-bottom: none; }
  .ach-icon {
    width: 34px; height: 34px; flex-shrink: 0;
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    display: grid; place-items: center;
    color: var(--primary);
    background: var(--well);

  .ach.locked .ach-icon { color: var(--border); }
  .ach.locked .ach-name, .ach.locked .ach-desc { color: var(--muted); }
  .ach-name { font-size: 0.85rem; font-weight: 600; }
  .ach-desc { font-size: 0.74rem; color: var(--muted); }
  .ach-pct { margin-left: auto; font-family: var(--mono); font-size: 0.68rem; color: var(--muted); white-space: nowrap; }

  .notes { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 18px; }
  .notes h2 {
    font-family: var(--mono); font-weight: 700; font-size: 0.68rem;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 14px;
  }
  .note-entry { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .note-entry:last-child { border-bottom: none; }
  .note-v { font-family: var(--mono); font-size: 0.72rem; color: var(--primary); margin-bottom: 3px; }
  .note-t { font-size: 0.83rem; color: var(--fg); }
  .note-t .dim { color: var(--muted); }

  @media (max-width: 820px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; max-height: 320px; border-right: none; border-bottom: 1px solid var(--border); }
    .panel-grid { grid-template-columns: 1fr; }
    .chrome-tabs { display: none; }
    .detail-inner { padding: 18px 16px 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

    if (state.sort === 'name') arr.sort(function (a, b) { return a.name.localeCompare(b.name); });
    if (state.sort === 'hours-desc') arr.sort(function (a, b) { return b.hours - a.hours; });
    if (state.sort === 'hours-asc') arr.sort(function (a, b) { return a.hours - b.hours; });
    return arr;
  }

  function renderList() {
    var arr = visiblePoses();
    listEl.innerHTML = '';
    if (!arr.length) {
      var empty = document.createElement('div');
      empty.style.cssText = 'padding:16px 14px;color:var(--muted);font-size:0.82rem;';
      empty.textContent = 'No poses match. You own 247, so keep trying.';
      listEl.appendChild(empty);
      return;
    }
    arr.forEach(function (p) {
      var btn = document.createElement('button');
      btn.className = 'pose-row' + (p.id === state.selected ? ' selected' : '');
      btn.setAttribute('role', 'listitem');
      btn.innerHTML = '<span>' + (p.ea ? '<span class="ea-dot" aria-hidden="true"></span>' : '') + p.name + '</span><span class="hrs">' + fmtHours(p.hours) + '</span>';
      btn.addEventListener('click', function () {
        state.selected = p.id;
        renderList();
        renderDetail();
      });
      listEl.appendChild(btn);
    });
  }

  function achIconSvg() {
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.4 4.86 5.36.78-3.88 3.78.92 5.34L12 14.24l-4.8 2.52.92-5.34L4.24 7.64l5.36-.78L12 2z"/></svg>';
  }

  function renderDetail() {
    var p = POSES.filter(function (x) { return x.id === state.selected; })[0];
    if (!p) return;

    var artPh = p.img ? '' : '<div class="art-ph" role="img" aria-label="Placeholder capsule art for ' + p.name + '"><span>' + p.name.charAt(0) + '</span></div>';

    var html = '';
    html += '<div class="art-frame" id="artFrame">' + artPh + (p.tag ? '<span class="corner-tag">' + p.tag + '</span>' : '') + '</div>';
    html += '<div class="title-row"><h1 class="pose-title">' + p.name + '</h1><span class="build-no">' + p.build + '</span></div>';
    html += '<div class="verdict-row">';
    html += '<span><span class="k">All reviews:</span> <span class="' + p.verdictAll.cls + '">' + p.verdictAll.label + '</span> <span class="k">(' + p.verdictAll.count + ')</span></span>';
    html += '<span><span class="k">Recent:</span> <span class="' + p.verdictRecent.cls + '">' + p.verdictRecent.label + '</span></span>';
    html += '</div>';
    html += '<div class="chips">' + p.chips.map(function (c) { return '<span class="chip">' + c + '</span>'; }).join('') + '</div>';

    html += '<div class="action-bar">';
    html += '<button class="btn-play" id="practiceBtn">Practice Now</button>';
    html += '<div class="install-zone"><div class="install-track" id="installTrack"><div class="install-fill" id="installFill"></div></div><div class="install-status" id="installStatus"></div></div>';
    html += '<div class="hours-plate">PRACTICED ' + fmtHours(p.hours).toUpperCase() + '<br>LAST SESSION: LONGER AGO THAN YOU THINK</div>';
    html += '</div>';

    html += '<div class="panel-grid">';
    html += '<div class="panel"><h2>Review Histogram</h2>';
    html += histRow('All time', p.verdictAll.pct);
    html += histRow('Recent', p.verdictRecent.pct);
    html += histRow('After class', Math.min(99, p.verdictAll.pct + 8));
    html += histRow('During class', Math.max(4, p.verdictRecent.pct - 26));
    html += '</div>';
    html += '<div class="panel"><h2>Achievements</h2>' + p.achievements.map(function (a) {
      return '<div class="ach' + (a.locked ? ' locked' : '') + '"><span class="ach-icon">' + achIconSvg() + '</span><div><div class="ach-name">' + a.name + '</div><div class="ach-desc">' + a.desc + '</div></div><span class="ach-pct">' + a.pct + ' of yogis</span></div>';
    }).join('') + '</div>';
    html += '</div>';

    html += '<div class="notes"><h2>Patch Notes</h2>' + p.notes.map(function (n) {
      return '<div class="note-entry"><div class="note-v">' + n.v + '</div><div class="note-t">' + n.t + '</div></div>';
    }).join('') + '</div>';

    detailEl.innerHTML = html;
    if (p.img) {
      var frame = document.getElementById('artFrame');
      var im = document.createElement('img');
      im.src = p.img;
      im.alt = p.alt;
      im.width = 800;
      im.height = 450;
      frame.insertBefore(im, frame.firstChild);
    }
    wirePractice(p);
  }

  function histRow(label, pct) {
    var neg = pct < 50;
    return '<div class="hist-row"><span class="k">' + label + '</span><div class="hist-track"><div class="hist-fill' + (neg ? ' neg' : '') + '" style="width:' + pct + '%"></div></div><span class="n">' + pct + '%</span></div>';
  }

  function wirePractice(p) {
    var btn = document.getElementById('practiceBtn');
    var track = document.getElementById('installTrack');
    var fill = document.getElementById('installFill');
    var status = document.getElementById('installStatus');
    var timer = null;

    btn.addEventListener('click', function () {
      if (btn.disabled) return;
      btn.disabled = true;
      btn.textContent = 'Installing…';
      track.style.display = 'block';
      var pct = 0;

      if (reduced) {
        fill.style.width = '100%';
        finish();
        return;
      }

      timer = setInterval(function () {
        if (pct < 91) {
          pct += Math.max(1, Math.round((91 - pct) / 12));
          if (pct > 91) pct = 91;
          fill.style.width = pct + '%';
          status.textContent = 'Installing into hamstrings… ' + pct + '%';
        } else {
          clearInterval(timer);
          status.textContent = 'Verifying integrity of hips… 91%';
          setTimeout(function () {
            fill.style.width = '100%';
            finish();
          }, 2600);
        }
      }, 120);
    });

    function finish() {
      status.textContent = 'Installed. Session logged: 0.1 hrs.';
      btn.textContent = 'Practiced today';
      var plate = document.querySelector('.hours-plate');
      if (plate) plate.innerHTML = 'PRACTICED ' + (p.hours + 0.1).toFixed(1) + ' HRS<br>LAST SESSION: JUST NOW. WELL DONE.';
    }
  }

  searchEl.addEventListener('input', function () {
    state.query = searchEl.value;
    renderList();
  });
  sortEl.addEventListener('change', function () {
    state.sort = sortEl.value;
    renderList();
  });

  renderList();
  renderDetail();
})();
</script>
</body>
</html>
